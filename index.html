<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zecrow</title>
<style>
body {
  background: #ffffff;
  margin: 0;
  min-height: 100vh;
  position: relative;
}
.component-title {
  width: 100%;
  position: absolute;
  z-index: 999;
  top: 30px;
  left: 0;
  padding: 0;
  margin: 0;
  font-size: 1rem;
  font-weight: 700;
  color: #888;
  text-align: center;
}
.topbar {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin: 14px 16px 0;
}
.tab-container {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  width: fit-content;
  margin: 0;
  padding: 2px;
  background-color: var(--pill);
  border-radius: 9px;
}
.indicator {
  content: "";
  width: 130px;
  height: 28px;
  background: var(--indicator-bg);
  position: absolute;
  top: 2px;
  left: 2px;
  z-index: 9;
  border: 0.5px solid rgba(0, 0, 0, 0.04);
  box-shadow: 0px 3px 8px rgba(0, 0, 0, 0.12), 0px 3px 1px rgba(0, 0, 0, 0.04);
  border-radius: 7px;
  transition: all 0.2s ease-out;
}
.tab {
  width: 130px;
  height: 28px;
  position: absolute;
  z-index: 99;
  outline: none;
  opacity: 0;
}
.tab_label {
  width: 130px;
  height: 28px;
  position: relative;
  z-index: 999;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 0;
  font-size: 0.75rem;
  color: var(--tab-text);
  opacity: 0.6;
  cursor: pointer;
}
.tab--1:checked ~ .indicator {
  left: 2px;
}
.tab--2:checked ~ .indicator {
  left: calc(130px + 2px);
}
.tab--3:checked ~ .indicator {
  left: calc(130px * 2 + 2px);
}
.tab--4:checked ~ .indicator {
  left: calc(130px * 3 + 2px);
}
.tab--5:checked ~ .indicator {
  left: calc(130px * 4 + 2px);
}
.theme-side {
  position: static;
  z-index: 3;
  transform: scale(0.65);
  transform-origin: center;
  display: flex;
  align-items: center;
}
.switch-container {
  position: relative;
  display: inline-block;
  width: 3.5em;
  height: 2em;
}
.switch-container input {
  opacity: 0;
  width: 0;
  height: 0;
}
.switch-container .slider {
  --background: linear-gradient(to right, #090613ef, #18151f);
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--background);
  transition: background-color 0.5s;
  border-radius: 30px;
}
.switch-container .slider:before {
  position: absolute;
  content: "";
  height: 1.4em;
  width: 1.4em;
  border-radius: 50%;
  left: 10%;
  bottom: 15%;
  box-shadow: inset 15px -4px 0px 15px #f8ea27;
  background: var(--background);
  transition: transform 0.5s, box-shadow 0.5s;
}
.switch-container input:checked + .slider {
  background-color: #000;
}
.switch-container input:checked + .slider:before {
  transform: translateX(100%);
  box-shadow: inset 8px -4px 0px 0px #f8f8f4;
}
:root {
  background: #050505;
  color-scheme: dark;
  --accent: #cfef00;
  --accent-hover: #c4e201;
}
.carbon-stage {
  position: relative;
  isolation: isolate;
  width: 100%;
  min-height: 100vh;
  overflow: clip;
  --pill: #dadadb;
  --tab-text: #1a1a1a;
  --indicator-bg: #ffffff;
  background: #ffffff;
  color-scheme: light;
}
.carbon-stage.dark-mode {
  --pill: #202022;
  --tab-text: #f2f2ef;
  --indicator-bg: #343438;
  color-scheme: dark;
}
.carbon-layer {
  position: absolute;
  inset: 0;
  z-index: -10;
  pointer-events: none;
  transition: opacity .35s ease, background .35s ease;
}
.dark-mode {
  background: #0c0c0c;
}
.dark-mode .carbon-base {
  background: radial-gradient(
    circle at 50% 12%,
    #1c1c1c 0%,
    #121212 36%,
    #0c0c0c 68%,
    #050505 100%
  );
}
.dark-mode .carbon-spotlight {
  background-image: radial-gradient(
    circle at 50% 0%,
    rgba(255, 255, 255, .14) 0%,
    transparent 46%
  );
  opacity: .5;
}
.dark-mode .carbon-vignette {
  background-image: radial-gradient(
    circle at center,
    transparent 42%,
    rgba(0, 0, 0, .55) 100%
  );
}
.dark-mode .carbon-grain {
  background-image: radial-gradient(
    circle at center,
    rgba(255, 255, 255, .7) 1px,
    transparent 1px
  );
  background-size: 4px 4px;
  opacity: .03;
}
.carbon-stage:not(.dark-mode) .carbon-base {
  background: radial-gradient(
    circle at 50% 12%,
    #ffffff 0%,
    #f1f1ee 45%,
    #e2e2de 100%
  );
}
.carbon-stage:not(.dark-mode) .carbon-spotlight {
  background-image: radial-gradient(
    circle at 50% 0%,
    rgba(0, 0, 0, .08) 0%,
    transparent 46%
  );
  opacity: .6;
}
.carbon-stage:not(.dark-mode) .carbon-vignette {
  background-image: radial-gradient(
    circle at center,
    transparent 55%,
    rgba(0, 0, 0, .12) 100%
  );
}
.carbon-stage:not(.dark-mode) .carbon-grain {
  background-image: radial-gradient(
    circle at center,
    rgba(0, 0, 0, .55) 1px,
    transparent 1px
  );
  background-size: 4px 4px;
  opacity: .05;
}
:root:not(.dark-mode) {
  background: #ffffff;
  color-scheme: light;
}
.carbon-spotlight,
.carbon-vignette,
.carbon-grain {
  z-index: 1;
}
.stars {
  position: absolute;
  inset: 0;
  z-index: -5;
  pointer-events: none;
}
</style>
</head>
<body>
<main class="carbon-stage dark-mode" id="stage">
  <div class="carbon-layer carbon-base" aria-hidden="true"></div>
  <div class="carbon-layer carbon-spotlight" aria-hidden="true"></div>
  <div class="carbon-layer carbon-vignette" aria-hidden="true"></div>
  <div class="carbon-layer carbon-grain" aria-hidden="true"></div>
  <canvas class="stars" id="stars" aria-hidden="true"></canvas>
<header class="topbar">
<div class="tab-container">
  <input type="radio" name="tab" id="tab1" class="tab tab--1" />
  <label class="tab_label" for="tab1">Zecrow</label>

  <input type="radio" name="tab" id="tab2" class="tab tab--2" />
  <label class="tab_label" for="tab2">How It Works</label>

  <input type="radio" name="tab" id="tab3" class="tab tab--3" />
  <label class="tab_label" for="tab3">Buyer Protection</label>

  <input type="radio" name="tab" id="tab4" class="tab tab--4" />
  <label class="tab_label" for="tab4">For Merchants</label>

  <input type="radio" name="tab" id="tab5" class="tab tab--5" />
  <label class="tab_label" for="tab5">Sign In</label>

  <div class="indicator"></div>
</div>
<div class="theme-side">
<label class="switch-container">
  <input type="checkbox" id="theme-toggle" aria-label="Toggle light and dark mode">
  <span class="slider"></span>
</label>
</div>
</header>
</main>
<script>
(function () {
  var toggle = document.getElementById('theme-toggle');
  var stage = document.getElementById('stage');
  toggle.addEventListener('change', function () {
    stage.classList.toggle('dark-mode', !toggle.checked);
    document.documentElement.classList.toggle('dark-mode', !toggle.checked);
  });
  var canvas = document.getElementById('stars');
  var ctx = canvas.getContext('2d');
  var particles = [];
  var W = 0, H = 0;
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size() {
    W = canvas.width = stage.clientWidth;
    H = canvas.height = stage.clientHeight;
  }
  function make() {
    particles = [];
    var n = Math.max(60, Math.min(220, Math.floor(W * H / 7000)));
    for (var i = 0; i < n; i++) {
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.35,
        vy: (Math.random() - 0.5) * 0.35,
        r: 0.6 + Math.random() * 1.2,
        ph: Math.random() * 6.2832
      });
    }
  }
  function theme() {
    return stage.classList.contains('dark-mode') ? '255,255,255' : '25,25,28';
  }
  var T = 0;
  function twinkle(ph) {
    return 0.55 + 0.45 * Math.sin(T * 0.002 + ph);
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    var col = theme();
    for (var i = 0; i < particles.length; i++) {
      for (var j = i + 1; j < particles.length; j++) {
        var a = particles[i], b = particles[j];
        var dx = a.x - b.x, dy = a.y - b.y;
        var d2 = dx * dx + dy * dy;
        if (d2 < 16900) {
          var pulse = (twinkle(a.ph) + twinkle(b.ph)) / 2;
          var o = (1 - Math.sqrt(d2) / 130) * 0.35 * pulse;
          ctx.strokeStyle = 'rgba(' + col + ',' + o.toFixed(3) + ')';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }
    for (var k = 0; k < particles.length; k++) {
      var p = particles[k];
      var tw = twinkle(p.ph);
      ctx.fillStyle = 'rgba(' + col + ',' + (0.3 + 0.5 * tw).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (0.7 + 0.5 * tw), 0, 6.2832);
      ctx.fill();
    }
  }
  function tick(ts) {
    T = ts || 0;
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
    }
    draw();
    requestAnimationFrame(tick);
  }
  size();
  make();
  draw();
  window.addEventListener('resize', function () {
    size();
    make();
    if (reduced) draw();
  });
  if (!reduced) tick();
})();
</script>
</body>
</html>
