<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zecrow</title>
<style>
body {
  background: #ffffff;
  margin: 0;
  min-height: 100vh;
  position: relative;
}
.component-title {
  width: 100%;
  position: absolute;
  z-index: 999;
  top: 30px;
  left: 0;
  padding: 0;
  margin: 0;
  font-size: 1rem;
  font-weight: 700;
  color: #888;
  text-align: center;
}
.tab-container {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  width: fit-content;
  margin: 12px auto 0;
  padding: 2px;
  background-color: #dadadb;
  border-radius: 9px;
}
.indicator {
  content: "";
  width: 130px;
  height: 28px;
  background: #ffffff;
  position: absolute;
  top: 2px;
  left: 2px;
  z-index: 9;
  border: 0.5px solid rgba(0, 0, 0, 0.04);
  box-shadow: 0px 3px 8px rgba(0, 0, 0, 0.12), 0px 3px 1px rgba(0, 0, 0, 0.04);
  border-radius: 7px;
  transition: all 0.2s ease-out;
}
.tab {
  width: 130px;
  height: 28px;
  position: absolute;
  z-index: 99;
  outline: none;
  opacity: 0;
}
.tab_label {
  width: 130px;
  height: 28px;
  position: relative;
  z-index: 999;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 0;
  font-size: 0.75rem;
  opacity: 0.6;
  cursor: pointer;
}
.tab--1:checked ~ .indicator {
  left: 2px;
}
.tab--2:checked ~ .indicator {
  left: calc(130px + 2px);
}
.tab--3:checked ~ .indicator {
  left: calc(130px * 2 + 2px);
}
.tab--4:checked ~ .indicator {
  left: calc(130px * 3 + 2px);
}
.tab--5:checked ~ .indicator {
  left: calc(130px * 4 + 2px);
}
.theme-side {
  position: absolute;
  top: 12px;
  right: 16px;
  z-index: 3;
  transform: scale(0.65);
  transform-origin: top right;
}
.switch-container {
  position: relative;
  display: inline-block;
  width: 3.5em;
  height: 2em;
}
.switch-container input {
  opacity: 0;
  width: 0;
  height: 0;
}
.switch-container .slider {
  --background: linear-gradient(to right, #090613ef, #18151f);
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--background);
  transition: background-color 0.5s;
  border-radius: 30px;
}
.switch-container .slider:before {
  position: absolute;
  content: "";
  height: 1.4em;
  width: 1.4em;
  border-radius: 50%;
  left: 10%;
  bottom: 15%;
  box-shadow: inset 15px -4px 0px 15px #f8ea27;
  background: var(--background);
  transition: transform 0.5s, box-shadow 0.5s;
}
.switch-container input:checked + .slider {
  background-color: #000;
}
.switch-container input:checked + .slider:before {
  transform: translateX(100%);
  box-shadow: inset 8px -4px 0px 0px #f8f8f4;
}
</style>
</head>
<body>
<div class="tab-container">
  <input type="radio" name="tab" id="tab1" class="tab tab--1" />
  <label class="tab_label" for="tab1">Zecrow</label>

  <input type="radio" name="tab" id="tab2" class="tab tab--2" />
  <label class="tab_label" for="tab2">How It Works</label>

  <input type="radio" name="tab" id="tab3" class="tab tab--3" />
  <label class="tab_label" for="tab3">Buyer Protection</label>

  <input type="radio" name="tab" id="tab4" class="tab tab--4" />
  <label class="tab_label" for="tab4">For Merchants</label>

  <input type="radio" name="tab" id="tab5" class="tab tab--5" />
  <label class="tab_label" for="tab5">Sign In</label>

  <div class="indicator"></div>
</div>
<div class="theme-side">
<label class="switch-container">
  <input type="checkbox">
  <span class="slider"></span>
</label>
</div>
</body>
</html>
